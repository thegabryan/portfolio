<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1117" />
  <title>Random Painting Background</title>
  <style>
    :root {
      --panel-bg: rgba(15, 16, 20, 0.92);
      --panel-border: rgba(255, 255, 255, 0.14);
      --text: #edf2ff;
      --muted: #d4d9eb;
      --accent: #9bc4ff;
      --accent-strong: #cfe6ff;
      --shadow: rgba(0, 0, 0, 0.48);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: #0d1117;
    }

    body {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background-color: #0d1117;
      background-repeat: no-repeat;
    }

    .menu-toggle {
      position: fixed;
      z-index: 3;
      top: 16px;
      right: 16px;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 12px;
      background: rgba(15, 16, 20, 0.12);
      color: rgba(255, 255, 255, 0.75);
      font: 22px/1 system-ui, sans-serif;
      cursor: pointer;
      opacity: 0.2;
      transition: opacity 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    .menu-toggle:hover,
    .menu-toggle:focus-visible,
    .menu-toggle[aria-expanded="true"] {
      opacity: 0.95;
      border-color: var(--panel-border);
      background: rgba(15, 16, 20, 0.78);
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .panel {
      position: fixed;
      z-index: 2;
      top: 50%;
      left: 50%;
      width: min(760px, calc(100% - 32px));
      max-height: calc(100vh - 40px);
      max-height: calc(100dvh - 40px);
      padding: 22px;
      overflow-x: hidden;
      overflow-y: auto;
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      background: var(--panel-bg);
      box-shadow: 0 20px 60px var(--shadow);
      backdrop-filter: blur(14px);
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, calc(-50% + 8px));
      transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
    }

    .panel.open {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%);
    }

    .panel-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.7rem, 3vw, 2.4rem);
      line-height: 1.1;
      letter-spacing: -0.06em;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    button, select {
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    button:hover {
      border-color: rgba(155, 196, 255, 0.7);
      background: rgba(155, 196, 255, 0.12);
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
      transform: none;
    }

    select { cursor: pointer; }
    select option { background: #171a20; color: var(--text); }

    .close-menu {
      flex: 0 0 auto;
      min-height: 36px;
      padding: 0 11px;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      margin-bottom: 14px;
    }

    input[type="url"] {
      width: 100%;
      min-width: 0;
      height: 42px;
      padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font: inherit;
    }

    input::placeholder { color: rgba(237, 242, 255, 0.6); }

    .options {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .options label { font-weight: 600; }

    .options select {
      min-height: 38px;
      padding: 0 10px;
    }

    .position-control {
      margin: 0 0 12px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
    }

    .position-control[hidden] { display: none; }

    .position-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .position-heading output {
      color: var(--accent-strong);
      font-weight: 700;
    }

    #verticalPosition {
      display: block;
      width: 100%;
      height: 22px;
      margin: 0;
      padding: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .position-hint {
      margin-top: 6px;
      color: rgba(237, 242, 255, 0.7);
      font-size: 0.78rem;
    }

    .image-info,
    .message {
      min-height: 1.4em;
      margin: 0 0 10px;
      color: rgba(237, 242, 255, 0.72);
      font-size: 0.82rem;
      overflow-wrap: anywhere;
    }

    .list-wrap {
      margin-top: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
    }

    #links {
      display: grid;
      gap: 8px;
      max-height: 300px;
      margin: 0;
      padding: 8px;
      overflow-y: auto;
      overflow-x: hidden;
      list-style: none;
    }

    #links li {
      display: grid;
      grid-template-columns: 104px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 8px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
    }

    #links li.selected {
      border-color: rgba(155, 196, 255, 0.7);
      background: rgba(155, 196, 255, 0.11);
    }

    .image-choice {
      display: block;
      width: 104px;
      min-width: 0;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 8px;
      background: #0d1117;
      cursor: pointer;
    }

    .image-choice:hover {
      border: 0;
      background: #0d1117;
      transform: none;
    }

    .image-choice img {
      display: block;
      width: 104px;
      height: 68px;
      object-fit: cover;
      background: #0d1117;
    }

    .image-details {
      min-width: 0;
    }

    .image-name {
      display: block;
      margin-bottom: 4px;
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 650;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .image-url {
      display: block;
      color: var(--muted);
      font-size: 0.76rem;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .remove-btn {
      flex: 0 0 34px;
      width: 34px;
      min-height: 34px;
      height: 34px;
      padding: 0;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.1);
      color: var(--accent-strong);
      font-weight: 700;
    }

    .empty-list {
      padding: 14px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .empty-list[hidden] { display: none; }

    .footer {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      color: rgba(237, 242, 255, 0.8);
      font-size: 0.84rem;
    }

    .footer strong { color: var(--accent-strong); }

    @media (max-width: 620px) {
      .panel { padding: 18px 16px 14px; }
      .controls { grid-template-columns: 1fr auto; }
      .menu-toggle { top: 10px; right: 10px; }
    }

    @media (max-width: 440px) {
      #links li {
        grid-template-columns: 76px minmax(0, 1fr) auto;
        gap: 9px;
      }

      .image-choice {
        width: 76px;
      }

      .image-choice img {
        width: 76px;
        height: 58px;
      }

      .image-name { font-size: 0.82rem; }
      .image-url { font-size: 0.7rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <button
    class="menu-toggle"
    id="menuToggle"
    type="button"
    aria-controls="settingsPanel"
    aria-expanded="false"
    aria-label="Open image settings"
    title="Image settings"
  >☰</button>

  <main class="panel" id="settingsPanel" aria-labelledby="pageTitle" aria-hidden="true" inert>
    <div class="panel-heading">
      <div>
        <h1 id="pageTitle">Random painting</h1>
        <p>On page load, one image is chosen randomly and stays until you choose another.</p>
      </div>
      <button class="close-menu" id="closeMenu" type="button" aria-label="Close image settings">Close</button>
    </div>

    <form class="controls" id="addForm">
      <input id="imageUrl" type="url" placeholder="Paste an image or Wikimedia link" aria-label="Image URL" required />
      <button id="addButton" type="submit">Add</button>
    </form>

    <div class="options">
      <label for="fitMode">Image fit</label>
      <select id="fitMode">
        <option value="cover">Zoom / fill (crop)</option>
        <option value="stretch">Stretch (may distort)</option>
        <option value="contain">Fit whole image (may show bars)</option>
      </select>

      <label for="qualitySelect">Quality</label>
      <select id="qualitySelect" aria-label="Image quality" disabled></select>
    </div>

    <div class="position-control" id="positionControl" hidden>
      <div class="position-heading">
        <label for="verticalPosition">Painting vertical position</label>
        <output id="positionValue" for="verticalPosition">50</output>
      </div>
      <input id="verticalPosition" type="range" min="0" max="100" step="1" value="50" />
      <div class="position-hint">0 = image bottom aligns with screen bottom · 100 = image top aligns with screen top</div>
    </div>

    <p class="image-info" id="imageInfo" aria-live="polite"></p>

    <div class="list-wrap">
      <ul id="links" aria-live="polite"></ul>
      <div class="empty-list" id="emptyList">No images saved. Add an image URL above.</div>
    </div>

    <div class="footer">
      <span>Saved images: <strong id="count">0</strong></span>
    </div>
    <p class="message" id="message" role="status"></p>
  </main>

  <script>
    const STORAGE_KEY = 'new-tab-painting-library-v3';
    const OLD_STORAGE_KEYS = [
      'new-tab-painting-links-v2',
      'new-tab-painting-links'
    ];

    const WIKIMEDIA_WIDTHS = [500, 720, 1280, 1920, 3840];

    const OLD_STOCK_URLS = [
      'https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?auto=format&fit=crop&w=1600&q=80',
      'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=80',
      'https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=1600&q=80',
      'https://images.unsplash.com/photo-1515405295579-ba7b45403062?auto=format&fit=crop&w=1600&q=80'
    ];

    const menuToggle = document.getElementById('menuToggle');
    const settingsPanel = document.getElementById('settingsPanel');
    const closeMenuButton = document.getElementById('closeMenu');
    const addForm = document.getElementById('addForm');
    const imageUrlInput = document.getElementById('imageUrl');
    const addButton = document.getElementById('addButton');
    const fitMode = document.getElementById('fitMode');
    const qualitySelect = document.getElementById('qualitySelect');
    const positionControl = document.getElementById('positionControl');
    const verticalPosition = document.getElementById('verticalPosition');
    const positionValue = document.getElementById('positionValue');
    const imageInfo = document.getElementById('imageInfo');
    const message = document.getElementById('message');
    const linksList = document.getElementById('links');
    const emptyList = document.getElementById('emptyList');
    const countEl = document.getElementById('count');

    let library = [];
    let currentImageId = null;
    let imageInfoRequest = 0;

    function setMenuOpen(open) {
      settingsPanel.classList.toggle('open', open);
      settingsPanel.setAttribute('aria-hidden', String(!open));
      settingsPanel.inert = !open;
      menuToggle.setAttribute('aria-expanded', String(open));
      menuToggle.setAttribute('aria-label', open ? 'Close image settings' : 'Open image settings');

      if (open) imageUrlInput.focus();
      else menuToggle.focus();
    }

    menuToggle.addEventListener('click', () => {
      setMenuOpen(!settingsPanel.classList.contains('open'));
    });

    closeMenuButton.addEventListener('click', () => setMenuOpen(false));

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && settingsPanel.classList.contains('open')) {
        setMenuOpen(false);
      }
    });

    document.addEventListener('click', event => {
      if (
        settingsPanel.classList.contains('open') &&
        !settingsPanel.contains(event.target) &&
        !menuToggle.contains(event.target)
      ) {
        setMenuOpen(false);
      }
    });

    function makeId() {
      if (globalThis.crypto?.randomUUID) return crypto.randomUUID();
      return `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    }

    function fileKey(url) {
      try {
        const parsed = new URL(url);
        const host = parsed.hostname.toLowerCase();

        if (
          host === 'commons.wikimedia.org' ||
          host.endsWith('.wikipedia.org') ||
          host === 'upload.wikimedia.org' ||
          host === 'thumb.wikimedia.org'
        ) {
          const fileName = getWikiFileName(url);
          if (fileName) return `wiki:${fileName.replaceAll('_', ' ').toLowerCase()}`;
        }

        return `url:${parsed.href}`;
      } catch {
        return `url:${String(url).trim()}`;
      }
    }

    function isOldStockUrl(url) {
      return OLD_STOCK_URLS.some(stock => fileKey(stock) === fileKey(url));
    }

    function normalizeVariant(variant) {
      if (typeof variant === 'string') {
        return { url: variant, width: null, height: null, label: 'Image' };
      }

      if (!variant || typeof variant !== 'object' || !variant.url) return null;

      return {
        url: String(variant.url),
        width: Number(variant.width) || null,
        height: Number(variant.height) || null,
        label: String(variant.label || '')
      };
    }

    function normalizeRecord(item) {
      if (typeof item === 'string') {
        const url = item.trim();
        if (!url || isOldStockUrl(url)) return null;
        return {
          id: makeId(),
          sourceUrl: url,
          url,
          fit: 'cover',
          y: 50,
          variants: [{ url, width: null, height: null, label: 'Original' }]
        };
      }

      if (!item || typeof item !== 'object') return null;

      const sourceUrl = String(item.sourceUrl || item.url || '').trim();
      const url = String(item.url || '').trim();
      if (!sourceUrl || !url || isOldStockUrl(sourceUrl) || isOldStockUrl(url)) return null;

      let variants = Array.isArray(item.variants)
        ? item.variants.map(normalizeVariant).filter(Boolean)
        : [];

      if (!variants.some(variant => variant.url === url)) {
        variants.unshift({
          url,
          width: Number(item.width) || null,
          height: Number(item.height) || null,
          label: 'Saved image'
        });
      }

      return {
        id: String(item.id || makeId()),
        sourceUrl,
        url,
        fit: ['cover', 'stretch', 'contain'].includes(item.fit) ? item.fit : 'cover',
        y: Number.isFinite(Number(item.y))
          ? Math.max(0, Math.min(100, Number(item.y)))
          : 50,
        variants,
        note: String(item.note || '')
      };
    }

    function readLibrary() {
      try {
        const currentSaved = localStorage.getItem(STORAGE_KEY);
        if (currentSaved !== null) {
          const parsed = JSON.parse(currentSaved);
          return Array.isArray(parsed) ? parsed.map(normalizeRecord).filter(Boolean) : [];
        }

        for (const oldKey of OLD_STORAGE_KEYS) {
          const oldSaved = localStorage.getItem(oldKey);
          if (oldSaved === null) continue;

          const parsed = JSON.parse(oldSaved);
          const migrated = Array.isArray(parsed)
            ? parsed.map(normalizeRecord).filter(Boolean)
            : [];

          const unique = [];
          for (const item of migrated) {
            if (!unique.some(saved => fileKey(saved.sourceUrl) === fileKey(item.sourceUrl))) {
              unique.push(item);
            }
          }

          localStorage.setItem(STORAGE_KEY, JSON.stringify(unique));
          return unique;
        }
      } catch (error) {
        console.warn('Could not read saved image list:', error);
      }

      return [];
    }

    function saveLibrary() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(library));
        return true;
      } catch (error) {
        console.warn('Could not save image list:', error);
        return false;
      }
    }

    function currentImage() {
      return library.find(item => item.id === currentImageId) || null;
    }

    function escapeCssUrl(url) {
      return url.replace(/["\\\n\r]/g, character => encodeURIComponent(character));
    }

    function applyImageStyle(item) {
      if (!item) {
        document.body.style.backgroundImage = 'none';
        document.body.style.backgroundSize = '';
        document.body.style.backgroundPosition = '';
        return;
      }

      const imageSize = item.fit === 'stretch' ? '100% 100%' : item.fit;
      const cssY = 100 - item.y;

      document.body.style.backgroundImage =
        `linear-gradient(rgba(10, 12, 18, 0.16), rgba(10, 12, 18, 0.16)), url("${escapeCssUrl(item.url)}")`;
      document.body.style.backgroundSize = `100% 100%, ${imageSize}`;
      document.body.style.backgroundPosition = `center center, center ${cssY}%`;
      document.body.style.backgroundColor = '#0d1117';
    }

    function updateQualityOptions(item) {
      qualitySelect.replaceChildren();

      if (!item) {
        qualitySelect.disabled = true;
        qualitySelect.add(new Option('No image selected', ''));
        return;
      }

      qualitySelect.disabled = false;

      item.variants.forEach((variant, index) => {
        const label = variant.label ||
          (variant.width && variant.height
            ? `${variant.width} × ${variant.height}`
            : index === 0 ? 'Original / saved image' : `Image ${index + 1}`);

        const option = new Option(label, variant.url);
        qualitySelect.add(option);
      });

      qualitySelect.value = item.url;
    }

    function setCurrentImage(item) {
      if (!item) {
        currentImageId = null;
        fitMode.value = 'cover';
        positionControl.hidden = true;
        verticalPosition.value = '50';
        positionValue.value = '50';
        updateQualityOptions(null);
        applyImageStyle(null);
        imageInfo.textContent = '';
        return;
      }

      currentImageId = item.id;
      fitMode.value = item.fit;
      verticalPosition.value = String(item.y);
      positionValue.value = String(item.y);
      positionControl.hidden = item.fit !== 'cover';

      updateQualityOptions(item);
      applyImageStyle(item);
      showImageInfo(item);
      renderLinks();
    }

    function saveCurrentPreset() {
      const item = currentImage();
      if (item) saveLibrary();
    }

    fitMode.addEventListener('change', () => {
      const item = currentImage();
      if (!item) return;

      item.fit = fitMode.value;
      positionControl.hidden = item.fit !== 'cover';
      applyImageStyle(item);
      saveCurrentPreset();
      showImageInfo(item);
    });

    verticalPosition.addEventListener('input', () => {
      const item = currentImage();
      if (!item) return;

      item.y = Number(verticalPosition.value);
      positionValue.value = String(item.y);
      applyImageStyle(item);
      saveCurrentPreset();
      showImageInfo(item);
    });

    qualitySelect.addEventListener('change', () => {
      const item = currentImage();
      if (!item) return;

      const matchingVariant = item.variants.find(candidate => candidate.url === qualitySelect.value);
      if (!matchingVariant) return;

      item.url = matchingVariant.url;
      applyImageStyle(item);
      saveCurrentPreset();
      showImageInfo(item);
      renderLinks();
      message.textContent = `Image quality set to ${matchingVariant.label}.`;
    });

    function showImageInfo(item) {
      const requestId = ++imageInfoRequest;
      const viewportText = `Screen ${window.innerWidth} × ${window.innerHeight}`;

      const variant = item.variants.find(candidate => candidate.url === item.url);
      if (variant?.width && variant?.height) {
        showDimensions(item, variant.width, variant.height, viewportText);
        return;
      }

      const image = new Image();

      image.onload = () => {
        if (requestId !== imageInfoRequest) return;
        if (variant) {
          variant.width = image.naturalWidth;
          variant.height = image.naturalHeight;
        }
        saveCurrentPreset();
        showDimensions(item, image.naturalWidth, image.naturalHeight, viewportText);
      };
      image.onerror = () => {
        if (requestId === imageInfoRequest) {
          imageInfo.textContent = `${viewportText} · Could not read this image’s dimensions`;
        }
      };
      image.src = item.url;
      imageInfo.textContent = `${viewportText} · Checking image dimensions…`;
    }

    function showDimensions(item, width, height, viewportText) {
      let detail = `${viewportText} · Image ${width} × ${height}`;

      if (item.fit === 'cover') {
        const scale = Math.max(window.innerWidth / width, window.innerHeight / height);
        const renderedWidth = width * scale;
        const renderedHeight = height * scale;
        const cropX = Math.max(0, Math.round((renderedWidth - window.innerWidth) / 2));
        const totalCropY = Math.max(0, Math.round(renderedHeight - window.innerHeight));
        const cropBottom = Math.round(totalCropY * item.y / 100);
        const cropTop = totalCropY - cropBottom;

        detail += ` · Approx. crop: ${cropX}px horizontally; ${cropTop}px top, ${cropBottom}px bottom`;
      } else if (item.fit === 'stretch') {
        detail += ' · Stretch fills the screen and may distort the image';
      } else {
        detail += ' · Fit shows the whole image; bars may appear';
      }

      imageInfo.textContent = detail;
    }

    function renderLinks() {
      linksList.replaceChildren();
      emptyList.hidden = library.length > 0;
      countEl.textContent = String(library.length);

      library.forEach((item, index) => {
        const row = document.createElement('li');
        if (item.id === currentImageId) row.classList.add('selected');

        const selectButton = document.createElement('button');
        selectButton.type = 'button';
        selectButton.className = 'image-choice';
        selectButton.setAttribute('aria-label', `Set image ${index + 1} as background`);

        const thumbnail = document.createElement('img');
        thumbnail.src = item.url;
        thumbnail.alt = '';
        thumbnail.loading = 'lazy';
        thumbnail.decoding = 'async';
        selectButton.appendChild(thumbnail);

        const details = document.createElement('div');
        details.className = 'image-details';

        const name = document.createElement('span');
        name.className = 'image-name';
        name.textContent = getDisplayName(item.sourceUrl);

        const url = document.createElement('span');
        url.className = 'image-url';
        url.textContent = item.sourceUrl;

        details.append(name, url);

        const removeButton = document.createElement('button');
        removeButton.type = 'button';
        removeButton.className = 'remove-btn';
        removeButton.textContent = '×';
        removeButton.title = 'Remove this image';
        removeButton.setAttribute('aria-label', `Remove image ${index + 1}`);

        selectButton.addEventListener('click', () => {
          setCurrentImage(item);
          message.textContent = 'Background image selected.';
        });

        removeButton.addEventListener('click', event => {
          event.stopPropagation();

          const removedImage = item;
          const wasCurrent = item.id === currentImageId;

          library = library.filter(saved => saved.id !== item.id);
          saveLibrary();
          renderLinks();

          if (wasCurrent) {
            const next = library.length
              ? library[Math.floor(Math.random() * library.length)]
              : null;
            setCurrentImage(next);
          }

          message.textContent = library.length
            ? 'Image removed.'
            : 'Image removed. No images are saved.';
        });

        row.append(selectButton, details, removeButton);
        linksList.appendChild(row);
      });
    }

    function getDisplayName(url) {
      try {
        const parsed = new URL(url);
        const fileName = getWikiFileName(url);
        if (fileName) return fileName;

        const lastPart = parsed.pathname.split('/').filter(Boolean).pop();
        return lastPart ? decodeURIComponent(lastPart) : parsed.hostname;
      } catch {
        return url;
      }
    }

    function getWikiFileName(inputUrl) {
      let parsed;
      try {
        parsed = new URL(inputUrl);
      } catch {
        return null;
      }

      const host = parsed.hostname.toLowerCase();

      if (host === 'commons.wikimedia.org' || host.endsWith('.wikipedia.org')) {
        const title = parsed.searchParams.get('title');
        if (title && /^File:/i.test(title)) {
          return title.replace(/^File:/i, '').replaceAll('_', ' ');
        }

        for (const candidate of [parsed.hash, parsed.pathname]) {
          const match = candidate.match(/File:([^?#]+)/i);
          if (match) {
            try {
              return decodeURIComponent(match[1]).replaceAll('_', ' ');
            } catch {
              return match[1].replaceAll('_', ' ');
            }
          }
        }
      }

      if (host === 'upload.wikimedia.org' || host === 'thumb.wikimedia.org') {
        const parts = parsed.pathname.split('/').filter(Boolean);
        if (!parts.length) return null;

        let fileName = parts[parts.length - 1];
        try {
          fileName = decodeURIComponent(fileName);
        } catch {
          // Leave as-is if decode fails.
        }

        return fileName.replace(/^\d+px-/, '').replaceAll('_', ' ');
      }

      return null;
    }

    function isDirectImageUrl(url) {
      try {
        const parsed = new URL(url);
        return /\.(avif|gif|jpe?g|png|svg|webp)$/i.test(parsed.pathname);
      } catch {
        return false;
      }
    }

    function makeWikiApiUrl(fileName, width = null) {
      const apiUrl = new URL('https://commons.wikimedia.org/w/api.php');
      const params = {
        action: 'query',
        format: 'json',
        origin: '*',
        prop: 'imageinfo',
        titles: `File:${fileName}`,
        iiprop: 'url|size'
      };

      if (width) params.iiurlwidth = String(width);
      apiUrl.search = new URLSearchParams(params).toString();
      return apiUrl;
    }

    async function queryWikiImage(fileName, width = null) {
      const response = await fetch(makeWikiApiUrl(fileName, width));
      if (!response.ok) throw new Error('Wikimedia image lookup failed.');

      const data = await response.json();
      const page = Object.values(data.query?.pages || {})[0];
      const info = page?.imageinfo?.[0];
      if (!info) throw new Error('Wikimedia did not return this file.');

      const isThumb = Boolean(width && info.thumburl);
      return {
        url: isThumb ? info.thumburl : info.url,
        width: isThumb ? info.thumbwidth : info.width,
        height: isThumb ? info.thumbheight : info.height
      };
    }

    async function getWikimediaVariants(sourceUrl) {
      const fileName = getWikiFileName(sourceUrl);
      if (!fileName) return null;

      const original = await queryWikiImage(fileName);
      if (!original.url) throw new Error('Wikimedia did not return the original image.');

      const variants = [{
        url: original.url,
        width: original.width,
        height: original.height,
        label: `Original (${original.width} × ${original.height})`
      }];

      const results = await Promise.allSettled(
        WIKIMEDIA_WIDTHS.map(width => queryWikiImage(fileName, width))
      );

      for (const result of results) {
        if (result.status !== 'fulfilled' || !result.value.url) continue;

        const candidate = result.value;
        if (variants.some(variant =>
          variant.url === candidate.url ||
          (variant.width === candidate.width && variant.height === candidate.height)
        )) {
          continue;
        }

        variants.push({
          url: candidate.url,
          width: candidate.width,
          height: candidate.height,
          label: `${candidate.width} × ${candidate.height}`
        });
      }

      variants.sort((a, b) => (a.width || 0) - (b.width || 0));
      const originalEntry = variants.find(candidate =>
        candidate.label.startsWith('Original')
      );

      if (originalEntry) {
        const index = variants.indexOf(originalEntry);
        variants.splice(index, 1);
        variants.push(originalEntry);
      }

      return variants;
    }

    addForm.addEventListener('submit', async event => {
      event.preventDefault();
      message.textContent = '';

      let parsed;
      try {
        parsed = new URL(imageUrlInput.value.trim());
      } catch {
        imageUrlInput.setCustomValidity('Enter a valid image or Wikimedia URL.');
        imageUrlInput.reportValidity();
        return;
      }

      if (!['http:', 'https:'].includes(parsed.protocol)) {
        imageUrlInput.setCustomValidity('Use an HTTP or HTTPS URL.');
        imageUrlInput.reportValidity();
        return;
      }

      imageUrlInput.setCustomValidity('');
      const sourceUrl = parsed.href;
      const key = fileKey(sourceUrl);

      if (library.some(item => fileKey(item.sourceUrl) === key)) {
        message.textContent = 'That image is already in your list.';
        return;
      }

      addButton.disabled = true;
      addButton.textContent = 'Checking…';

      try {
        let variants = null;

        try {
          variants = await getWikimediaVariants(sourceUrl);
        } catch (error) {
          console.warn('Could not fetch Wikimedia image qualities:', error);
        }

        if (!variants && isDirectImageUrl(sourceUrl)) {
          variants = [{
            url: sourceUrl,
            width: null,
            height: null,
            label: 'Linked image'
          }];
        }

        if (!variants || !variants.length) {
          throw new Error('Could not find an image file from that link. Try a direct image URL or a Wikimedia File page.');
        }

        const fastVariant = [...variants]
          .filter(variant => variant.width && variant.width <= 720)
          .pop() || variants[0];

        const record = {
          id: makeId(),
          sourceUrl,
          url: fastVariant.url,
          fit: 'cover',
          y: 50,
          variants,
          note: variants.length > 1
            ? `Defaulting to ${fastVariant.label} for faster loading`
            : ''
        };

        library.push(record);
        saveLibrary();
        imageUrlInput.value = '';
        renderLinks();
        setCurrentImage(record);
        message.textContent = record.note || 'Image added.';
      } catch (error) {
        message.textContent = error.message || 'Could not add that image.';
      } finally {
        addButton.disabled = false;
        addButton.textContent = 'Add';
      }
    });

    imageUrlInput.addEventListener('input', () => imageUrlInput.setCustomValidity(''));

    window.addEventListener('resize', () => {
      const item = currentImage();
      if (item) showImageInfo(item);
    });

    library = readLibrary();
    renderLinks();

    if (library.length) {
      const initial = library[Math.floor(Math.random() * library.length)];
      setCurrentImage(initial);
    } else {
      setCurrentImage(null);
    }
  </script>
</body>
</html>
