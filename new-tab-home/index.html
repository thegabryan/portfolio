<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Random Painting</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  img { width: 100%; height: 100%; object-fit: contain; display: block; }
</style>
</head>
<body>
<img id="art" alt="Random painting">
<script>
const api = "https://api.artic.edu/api/v1/artworks/search";
const params = "?q=painting&query[term][is_public_domain]=true&fields=id,title,image_id,artist_title&limit=1&page=";

async function load() {
  const page = Math.floor(Math.random() * 500) + 1;
  const r = await fetch(api + params + page);
  const data = await r.json();
  const item = data.data?.[0];
  if (item?.image_id) {
    document.getElementById("art").src =
      `https://www.artic.edu/iiif/2/${item.image_id}/full/1686,/0/default.jpg`;
  } else {
    load();
  }
}
load();
</script>
</body>
</html>
