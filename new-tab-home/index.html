<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Painting Background</title>
  <style>
    :root {
      --panel-bg: rgba(15, 16, 20, 0.62);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text: #edf2ff;
      --muted: #d4d9eb;
      --accent: #9bc4ff;
      --accent-strong: #cfe6ff;
      --shadow: rgba(0, 0, 0, 0.46);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: #0d1117;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      transition: background-image 0.6s ease, filter 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(10, 12, 18, 0.52), rgba(10, 12, 18, 0.22));
      backdrop-filter: blur(2px);
      z-index: 0;
    }

    .panel {
      position: relative;
      z-index: 1;
      width: min(720px, 100%);
      padding: 22px 22px 18px;
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      background: var(--panel-bg);
      box-shadow: 0 20px 60px var(--shadow);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 3vw, 3rem);
      line-height: 1.1;
      letter-spacing: -0.06em;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 1rem;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 10px;
      margin-bottom: 14px;
    }

    input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font: inherit;
    }

    input::placeholder { color: rgba(237, 242, 255, 0.6); }

    button {
      height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    button:hover {
      border-color: rgba(155, 196, 255, 0.7);
      background: rgba(155, 196, 255, 0.12);
      transform: translateY(-1px);
    }

    .list-wrap {
      margin-top: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      overflow: hidden;
    }

    #links {
      list-style: none;
      margin: 0;
      padding: 8px;
      display: grid;
      gap: 8px;
      max-height: 220px;
      overflow: auto;
    }

    #links li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
    }

    .url-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.92rem;
      color: var(--muted);
    }

    .remove-btn {
      flex: 0 0 auto;
      width: 34px;
      height: 30px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.1);
      color: var(--accent-strong);
      font-weight: 700;
    }

    .footer {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: rgba(237, 242, 255, 0.8);
      font-size: 0.84rem;
    }

    .footer strong {
      color: var(--accent-strong);
    }

    @media (max-width: 620px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .panel {
        padding: 18px 16px 14px;
      }
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Random painting</h1>
    <p>Saved image URLs are stored in the browser and chosen at random for the background.</p>

    <div class="controls">
      <input id="imageUrl" type="url" placeholder="Paste image URL here" aria-label="Image URL" />
      <button id="addUrl" type="button">Add</button>
      <button id="shuffle" type="button">Shuffle</button>
    </div>

    <div class="list-wrap">
      <ul id="links" aria-live="polite"></ul>
    </div>

    <div class="footer">
      <span>Stored URLs: <strong id="count">0</strong></span>
      <button id="reset" type="button">Reset</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'new-tab-painting-links';
    const FALLBACK_LINKS = [
      'https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?auto=format&fit=crop&w=1600&q=80',
      'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=80',
      'https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=1600&q=80',
      'https://images.unsplash.com/photo-1515405295579-ba7b45403062?auto=format&fit=crop&w=1600&q=80',
      'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=80'
    ];

    const imageUrlInput = document.getElementById('imageUrl');
    const addUrlButton = document.getElementById('addUrl');
    const shuffleButton = document.getElementById('shuffle');
    const resetButton = document.getElementById('reset');
    const linksList = document.getElementById('links');
    const countEl = document.getElementById('count');

    function safeReadLinks() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [...FALLBACK_LINKS];
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed) || parsed.length === 0) return [...FALLBACK_LINKS];
        return parsed.filter(Boolean).map(item => String(item).trim()).filter(Boolean);
      } catch (error) {
        return [...FALLBACK_LINKS];
      }
    }

    function saveLinks(list) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      } catch (error) {
        console.warn('Could not save list:', error);
      }
    }

    function pickRandomLink() {
      const links = safeReadLinks();
      return links[Math.floor(Math.random() * links.length)] || FALLBACK_LINKS[0];
    }

    function applyBackground(url) {
      document.body.style.backgroundImage = `url("${url}")`;
    }

    function renderLinks() {
      const links = safeReadLinks();
      linksList.innerHTML = '';

      links.forEach((link, index) => {
        const item = document.createElement('li');
        const text = document.createElement('span');
        text.className = 'url-text';
        text.textContent = link;

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'remove-btn';
        removeBtn.textContent = '×';
        removeBtn.title = 'Remove this image';
        removeBtn.addEventListener('click', () => {
          const next = safeReadLinks();
          next.splice(index, 1);
          if (next.length === 0) {
            saveLinks([...FALLBACK_LINKS]);
          } else {
            saveLinks(next);
          }
          renderLinks();
          applyBackground(pickRandomLink());
        });

        item.appendChild(text);
        item.appendChild(removeBtn);
        linksList.appendChild(item);
      });

      countEl.textContent = String(links.length);
    }

    function addLink() {
      const raw = imageUrlInput.value.trim();
      if (!raw) return;

      const next = safeReadLinks();
      if (!next.includes(raw)) next.push(raw);
      saveLinks(next);
      imageUrlInput.value = '';
      renderLinks();
      applyBackground(pickRandomLink());
    }

    function shuffleBackground() {
      applyBackground(pickRandomLink());
    }

    function resetLinks() {
      saveLinks([...FALLBACK_LINKS]);
      renderLinks();
      applyBackground(pickRandomLink());
    }

    addUrlButton.addEventListener('click', addLink);
    shuffleButton.addEventListener('click', shuffleBackground);
    resetButton.addEventListener('click', resetLinks);
    imageUrlInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        addLink();
      }
    });

    renderLinks();
    applyBackground(pickRandomLink());
  </script>
</body>
</html>
