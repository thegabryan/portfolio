<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1117" />
  <title>Random Painting Background</title>
  <style>
    :root {
      --panel-bg: rgba(15, 16, 20, 0.9);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text: #edf2ff;
      --muted: #d4d9eb;
      --accent: #9bc4ff;
      --accent-strong: #cfe6ff;
      --shadow: rgba(0, 0, 0, 0.46);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: #0d1117;
    }

    body {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background-color: #0d1117;
      background-repeat: no-repeat;
    }

    .menu-toggle {
      position: fixed;
      z-index: 3;
      top: 16px;
      right: 16px;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 12px;
      background: rgba(15, 16, 20, 0.12);
      color: rgba(255, 255, 255, 0.75);
      font: 22px/1 system-ui, sans-serif;
      cursor: pointer;
      opacity: 0.2;
      transition: opacity 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    .menu-toggle:hover,
    .menu-toggle:focus-visible,
    .menu-toggle[aria-expanded="true"] {
      opacity: 0.95;
      border-color: var(--panel-border);
      background: rgba(15, 16, 20, 0.78);
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .panel {
      position: fixed;
      z-index: 2;
      top: 50%;
      left: 50%;
      width: min(720px, calc(100% - 32px));
      max-height: calc(100vh - 40px);
      max-height: calc(100dvh - 40px);
      padding: 22px;
      overflow-x: hidden;
      overflow-y: auto;
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      background: var(--panel-bg);
      box-shadow: 0 20px 60px var(--shadow);
      backdrop-filter: blur(14px);
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, calc(-50% + 8px));
      transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
    }

    .panel.open {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%);
    }

    .panel-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.7rem, 3vw, 2.4rem);
      line-height: 1.1;
      letter-spacing: -0.06em;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    button, select {
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    button:hover {
      border-color: rgba(155, 196, 255, 0.7);
      background: rgba(155, 196, 255, 0.12);
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
      transform: none;
    }

    select { cursor: pointer; }
    select option { background: #171a20; color: var(--text); }

    .close-menu {
      flex: 0 0 auto;
      min-height: 36px;
      padding: 0 11px;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 10px;
      margin-bottom: 14px;
    }

    input {
      width: 100%;
      min-width: 0;
      height: 42px;
      padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font: inherit;
    }

    input::placeholder { color: rgba(237, 242, 255, 0.6); }

    .options {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .options label { font-weight: 600; }

    .options select {
      min-height: 38px;
      padding: 0 10px;
    }

    .position-control {
      margin: 0 0 12px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
    }

    .position-control[hidden] { display: none; }

    .position-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .position-heading output {
      color: var(--accent-strong);
      font-weight: 700;
    }

    #verticalPosition {
      display: block;
      width: 100%;
      height: 22px;
      margin: 0;
      padding: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .position-hint {
      margin-top: 6px;
      color: rgba(237, 242, 255, 0.7);
      font-size: 0.78rem;
    }

    .image-info {
      min-height: 1.4em;
      margin: 0 0 10px;
      color: rgba(237, 242, 255, 0.72);
      font-size: 0.8rem;
      overflow-wrap: anywhere;
    }

    .list-wrap {
      margin-top: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
    }

    #links {
      display: grid;
      gap: 8px;
      max-height: 220px;
      margin: 0;
      padding: 8px;
      overflow-y: auto;
      overflow-x: hidden;
      list-style: none;
    }

    #links li {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
    }

    .url-text {
      flex: 1 1 auto;
      min-width: 0;
      color: var(--muted);
      font-size: 0.9rem;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .remove-btn {
      flex: 0 0 34px;
      width: 34px;
      min-height: 30px;
      height: 30px;
      padding: 0;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.1);
      color: var(--accent-strong);
      font-weight: 700;
    }

    .empty-list {
      padding: 12px;
      color: var(--muted);
      font-size: 0.9rem;
      overflow-wrap: anywhere;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
      color: rgba(237, 242, 255, 0.8);
      font-size: 0.84rem;
    }

    .footer strong { color: var(--accent-strong); }

    .message {
      min-height: 1.3em;
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.84rem;
      overflow-wrap: anywhere;
    }

    @media (max-width: 620px) {
      .panel { padding: 18px 16px 14px; }
      .controls { grid-template-columns: 1fr 1fr; }
      .controls input { grid-column: 1 / -1; }
      .menu-toggle { top: 10px; right: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <button
    class="menu-toggle"
    id="menuToggle"
    type="button"
    aria-controls="settingsPanel"
    aria-expanded="false"
    aria-label="Open image settings"
    title="Image settings"
  >☰</button>

  <main class="panel" id="settingsPanel" aria-labelledby="pageTitle" aria-hidden="true" inert>
    <div class="panel-heading">
      <div>
        <h1 id="pageTitle">Random painting</h1>
        <p>Only images you add are saved and used as backgrounds.</p>
      </div>
      <button class="close-menu" id="closeMenu" type="button" aria-label="Close image settings">Close</button>
    </div>

    <form class="controls" id="addForm">
      <input id="imageUrl" type="url" placeholder="Paste an image or Wikimedia link" aria-label="Image URL" required />
      <button id="addUrl" type="submit">Add</button>
      <button id="shuffle" type="button">Shuffle</button>
    </form>

    <div class="options">
      <label for="fitMode">Image fit</label>
      <select id="fitMode">
        <option value="cover">Zoom / fill (crop)</option>
        <option value="stretch">Stretch (may distort)</option>
        <option value="contain">Fit whole image (may show bars)</option>
      </select>
    </div>

    <div class="position-control" id="positionControl" hidden>
      <div class="position-heading">
        <label for="verticalPosition">Painting vertical position</label>
        <output id="positionValue" for="verticalPosition">50</output>
      </div>
      <input id="verticalPosition" type="range" min="0" max="100" step="1" value="50" />
      <div class="position-hint">0 = image bottom aligns with screen bottom · 100 = image top aligns with screen top</div>
    </div>

    <p class="image-info" id="imageInfo" aria-live="polite"></p>

    <div class="list-wrap">
      <ul id="links" aria-live="polite"></ul>
      <div class="empty-list" id="emptyList">No images saved. Add an image URL above.</div>
    </div>

    <div class="footer">
      <span>Stored URLs: <strong id="count">0</strong></span>
    </div>
    <p class="message" id="message" role="status"></p>
  </main>

  <script>
    const STORAGE_KEY = 'new-tab-painting-links-v2';
    const OLD_STORAGE_KEY = 'new-tab-painting-links';
    const WIKIMEDIA_THUMB_WIDTH = 1280;

    // Filter the stock defaults used by earlier versions while preserving
    // image URLs the user added.
    const PREVIOUS_STOCK_URLS = [
      'https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?auto=format&fit=crop&w=1600&q=80',
      'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=80',
      'https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=1600&q=80',
      'https://images.unsplash.com/photo-1515405295579-ba7b45403062?auto=format&fit=crop&w=1600&q=80'
    ];

    const menuToggle = document.getElementById('menuToggle');
    const settingsPanel = document.getElementById('settingsPanel');
    const closeMenuButton = document.getElementById('closeMenu');
    const addForm = document.getElementById('addForm');
    const imageUrlInput = document.getElementById('imageUrl');
    const addButton = document.getElementById('addUrl');
    const shuffleButton = document.getElementById('shuffle');
    const linksList = document.getElementById('links');
    const emptyList = document.getElementById('emptyList');
    const countEl = document.getElementById('count');
    const fitMode = document.getElementById('fitMode');
    const positionControl = document.getElementById('positionControl');
    const verticalPosition = document.getElementById('verticalPosition');
    const positionValue = document.getElementById('positionValue');
    const imageInfo = document.getElementById('imageInfo');
    const message = document.getElementById('message');

    let library = [];
    let currentImage = null;
    let imageInfoRequest = 0;

    function setMenuOpen(open) {
      settingsPanel.classList.toggle('open', open);
      settingsPanel.setAttribute('aria-hidden', String(!open));
      settingsPanel.inert = !open;
      menuToggle.setAttribute('aria-expanded', String(open));
      menuToggle.setAttribute('aria-label', open ? 'Close image settings' : 'Open image settings');

      if (open) imageUrlInput.focus();
      else menuToggle.focus();
    }

    menuToggle.addEventListener('click', () => {
      setMenuOpen(!settingsPanel.classList.contains('open'));
    });

    closeMenuButton.addEventListener('click', () => setMenuOpen(false));

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && settingsPanel.classList.contains('open')) {
        setMenuOpen(false);
      }
    });

    document.addEventListener('click', event => {
      if (
        settingsPanel.classList.contains('open') &&
        !settingsPanel.contains(event.target) &&
        !menuToggle.contains(event.target)
      ) {
        setMenuOpen(false);
      }
    });

    function normalizeRecord(item) {
      if (typeof item === 'string') {
        const url = item.trim();
        if (!url) return null;
        return { url, sourceUrl: url, fit: 'cover', y: 50 };
      }

      if (!item || typeof item !== 'object') return null;

      const url = String(item.url || '').trim();
      if (!url) return null;

      return {
        url,
        sourceUrl: String(item.sourceUrl || item.url || url).trim(),
        fit: ['cover', 'stretch', 'contain'].includes(item.fit) ? item.fit : 'cover',
        y: Number.isFinite(Number(item.y))
          ? Math.max(0, Math.min(100, Number(item.y)))
          : 50,
        width: Number(item.width) || null,
        height: Number(item.height) || null,
        note: String(item.note || '')
      };
    }

    function isPreviousStockItem(item) {
      return PREVIOUS_STOCK_URLS.includes(item.url) ||
        PREVIOUS_STOCK_URLS.includes(item.sourceUrl);
    }

    function readLibrary() {
      try {
        let saved = localStorage.getItem(STORAGE_KEY);

        if (saved === null) {
          saved = localStorage.getItem(OLD_STORAGE_KEY);
        }

        if (saved === null) return [];

        const parsed = JSON.parse(saved);
        const records = Array.isArray(parsed)
          ? parsed.map(normalizeRecord).filter(Boolean)
          : [];

        // Remove stock images from the prior built-in defaults; keep custom URLs.
        return records.filter(item => !isPreviousStockItem(item));
      } catch {
        return [];
      }
    }

    function saveLibrary() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(library));
        return true;
      } catch (error) {
        console.warn('Could not save image settings:', error);
        return false;
      }
    }

    function imageKey(item) {
      return item?.sourceUrl || item?.url || '';
    }

    function setImageFit(mode) {
      if (!currentImage) return;

      currentImage.fit = ['cover', 'stretch', 'contain'].includes(mode)
        ? mode
        : 'cover';

      fitMode.value = currentImage.fit;
      positionControl.hidden = currentImage.fit !== 'cover';

      updateBackgroundStyle();
      saveCurrentPreset();
      showImageInfo(currentImage);
    }

    function updateBackgroundStyle() {
      if (!currentImage) return;

      const y = Math.max(0, Math.min(100, Number(currentImage.y) || 0));
      verticalPosition.value = String(y);
      positionValue.value = String(y);

      // Slider 0 aligns the image bottom; slider 100 aligns its top.
      const cssY = 100 - y;
      const imageSize = currentImage.fit === 'stretch'
        ? '100% 100%'
        : currentImage.fit;

      document.body.style.backgroundImage =
        `linear-gradient(rgba(10, 12, 18, 0.16), rgba(10, 12, 18, 0.16)), url("${escapeCssUrl(currentImage.url)}")`;
      document.body.style.backgroundSize = `100% 100%, ${imageSize}`;
      document.body.style.backgroundPosition = `center center, center ${cssY}%`;
      document.body.style.backgroundColor = '#0d1117';
    }

    function escapeCssUrl(url) {
      return url.replace(/["\\\n\r]/g, character => encodeURIComponent(character));
    }

    function saveCurrentPreset() {
      if (!currentImage) return;
      const index = library.findIndex(item => imageKey(item) === imageKey(currentImage));

      if (index >= 0) {
        library[index] = currentImage;
        saveLibrary();
      }
    }

    fitMode.addEventListener('change', () => setImageFit(fitMode.value));

    verticalPosition.addEventListener('input', () => {
      if (!currentImage) return;

      currentImage.y = Number(verticalPosition.value);
      updateBackgroundStyle();
      saveCurrentPreset();
      showImageInfo(currentImage);
    });

    function chooseRandomImage() {
      if (!library.length) return null;
      if (library.length === 1) return library[0];

      const alternatives = currentImage
        ? library.filter(item => imageKey(item) !== imageKey(currentImage))
        : library;

      const choices = alternatives.length ? alternatives : library;
      return choices[Math.floor(Math.random() * choices.length)];
    }

    function showImageInfo(item) {
      const requestId = ++imageInfoRequest;
      const viewportText = `Screen ${window.innerWidth} × ${window.innerHeight}`;

      if (item.width && item.height) {
        showDimensions(item, viewportText);
        return;
      }

      const image = new Image();

      image.onload = () => {
        if (requestId !== imageInfoRequest) return;

        item.width = image.naturalWidth;
        item.height = image.naturalHeight;
        saveCurrentPreset();
        showDimensions(item, viewportText);
      };

      image.onerror = () => {
        if (requestId === imageInfoRequest) {
          imageInfo.textContent = `${viewportText} · Could not read this image’s dimensions`;
        }
      };

      image.src = item.url;
      imageInfo.textContent = `${viewportText} · Checking image dimensions…`;
    }

    function showDimensions(item, viewportText) {
      let detail = `${viewportText} · Image ${item.width} × ${item.height}`;

      if (item.fit === 'cover') {
        const scale = Math.max(
          window.innerWidth / item.width,
          window.innerHeight / item.height
        );
        const renderedWidth = item.width * scale;
        const renderedHeight = item.height * scale;
        const cropX = Math.max(0, Math.round((renderedWidth - window.innerWidth) / 2));
        const totalCropY = Math.max(0, Math.round(renderedHeight - window.innerHeight));
        const croppedFromBottom = Math.round(totalCropY * item.y / 100);
        const croppedFromTop = totalCropY - croppedFromBottom;

        detail += ` · Approx. crop: ${cropX}px horizontally; ${croppedFromTop}px top, ${croppedFromBottom}px bottom`;
      } else if (item.fit === 'stretch') {
        detail += ' · Stretch fills the screen and may distort the image';
      } else {
        detail += ' · Fit shows the whole image; bars may appear';
      }

      if (item.note) detail += ` · ${item.note}`;
      imageInfo.textContent = detail;
    }

    function applyImage(item) {
      if (!item) {
        currentImage = null;
        document.body.style.backgroundImage = 'none';
        document.body.style.backgroundSize = '';
        document.body.style.backgroundPosition = '';
        imageInfo.textContent = '';
        positionControl.hidden = true;
        return;
      }

      currentImage = item;
      fitMode.value = item.fit;
      positionControl.hidden = item.fit !== 'cover';

      updateBackgroundStyle();
      saveCurrentPreset();
      showImageInfo(item);
    }

    function renderLinks() {
      linksList.replaceChildren();
      emptyList.hidden = library.length > 0;

      library.forEach((item, index) => {
        const row = document.createElement('li');
        const text = document.createElement('span');
        text.className = 'url-text';
        text.textContent = item.url;

        const removeButton = document.createElement('button');
        removeButton.type = 'button';
        removeButton.className = 'remove-btn';
        removeButton.textContent = '×';
        removeButton.title = 'Remove this image';
        removeButton.setAttribute('aria-label', `Remove image ${index + 1}`);

        removeButton.addEventListener('click', event => {
          // Keep the settings menu open after removing an image.
          event.stopPropagation();

          const removedImage = library[index];
          const wasCurrentImage = currentImage &&
            imageKey(currentImage) === imageKey(removedImage);

          library.splice(index, 1);
          saveLibrary();
          renderLinks();

          if (wasCurrentImage) {
            applyImage(chooseRandomImage());
          }

          message.textContent = library.length
            ? 'Image removed.'
            : 'Image removed. No images are saved.';
        });

        row.append(text, removeButton);
        linksList.appendChild(row);
      });

      countEl.textContent = String(library.length);
    }

    function getWikiFileName(inputUrl) {
      const parsed = new URL(inputUrl);
      const host = parsed.hostname.toLowerCase();

      if (host === 'commons.wikimedia.org' || host.endsWith('.wikipedia.org')) {
        const title = parsed.searchParams.get('title');

        if (title && /^File:/i.test(title)) {
          return title.replace(/^File:/i, '').replaceAll('_', ' ');
        }

        for (const candidate of [parsed.hash, parsed.pathname]) {
          const match = candidate.match(/(?:media\/)?File:([^?#]+)/i);
          if (match) {
            try {
              return decodeURIComponent(match[1]).replaceAll('_', ' ');
            } catch {
              return match[1].replaceAll('_', ' ');
            }
          }
        }
      }

      if (host === 'upload.wikimedia.org' || host === 'thumb.wikimedia.org') {
        const parts = parsed.pathname.split('/').filter(Boolean);
        if (!parts.length) return null;

        let fileName = parts[parts.length - 1];

        try {
          fileName = decodeURIComponent(fileName);
        } catch {
          // Keep the original URL-encoded name if decoding fails.
        }

        // Thumbnail URLs end in a size prefix, for example 1280px-Image.jpg.
        fileName = fileName.replace(/^\d+px-/, '');
        return fileName.replaceAll('_', ' ');
      }

      return null;
    }

    async function optimizeWikimediaImage(inputUrl) {
      const fileName = getWikiFileName(inputUrl);
      if (!fileName) return null;

      const apiUrl = new URL('https://commons.wikimedia.org/w/api.php');
      apiUrl.search = new URLSearchParams({
        action: 'query',
        format: 'json',
        origin: '*',
        prop: 'imageinfo',
        titles: `File:${fileName}`,
        iiprop: 'url|size',
        iiurlwidth: String(WIKIMEDIA_THUMB_WIDTH)
      }).toString();

      const response = await fetch(apiUrl);
      if (!response.ok) throw new Error('Wikimedia image lookup failed.');

      const data = await response.json();
      const page = Object.values(data.query?.pages || {})[0];
      const info = page?.imageinfo?.[0];

      if (!info) throw new Error('Wikimedia did not return image information.');

      const url = info.thumburl || info.url;
      if (!url) throw new Error('Wikimedia did not return an image URL.');

      const width = info.thumbwidth || info.width;
      const height = info.thumbheight || info.height;

      return {
        url,
        sourceUrl: inputUrl,
        fit: 'cover',
        y: 50,
        width,
        height,
        note: `Using ${width} × ${height} Wikimedia image for faster loading`
      };
    }

    function isDirectImageUrl(url) {
      try {
        const parsed = new URL(url);
        return /\.(avif|gif|jpe?g|png|svg|webp)$/i.test(parsed.pathname);
      } catch {
        return false;
      }
    }

    addForm.addEventListener('submit', async event => {
      event.preventDefault();
      message.textContent = '';

      let parsedUrl;
      try {
        parsedUrl = new URL(imageUrlInput.value.trim());
      } catch {
        imageUrlInput.setCustomValidity('Enter a valid image or Wikimedia URL.');
        imageUrlInput.reportValidity();
        return;
      }

      if (!['http:', 'https:'].includes(parsedUrl.protocol)) {
        imageUrlInput.setCustomValidity('Use an HTTP or HTTPS URL.');
        imageUrlInput.reportValidity();
        return;
      }

      imageUrlInput.setCustomValidity('');
      const enteredUrl = parsedUrl.href;

      // Reuse the saved rendition and its fit/position preset if this URL was
      // already added; no Wikimedia lookup or image-size analysis is needed.
      const savedRecord = library.find(item =>
        item.sourceUrl === enteredUrl || item.url === enteredUrl
      );

      if (savedRecord) {
        applyImage(savedRecord);
        message.textContent = 'Using the saved image and its saved position preset.';
        imageUrlInput.value = '';
        return;
      }

      addButton.disabled = true;
      addButton.textContent = 'Checking…';

      try {
        let record = null;

        try {
          record = await optimizeWikimediaImage(enteredUrl);
        } catch (error) {
          console.warn('Wikimedia image lookup failed:', error);
        }

        if (!record && isDirectImageUrl(enteredUrl)) {
          record = {
            url: enteredUrl,
            sourceUrl: enteredUrl,
            fit: 'cover',
            y: 50,
            note: ''
          };
        }

        if (!record) {
          throw new Error('Could not identify an image from that link. Try a direct image URL or a Wikimedia File page.');
        }

        library.push(record);
        saveLibrary();
        renderLinks();
        imageUrlInput.value = '';
        applyImage(record);
        message.textContent = record.note || 'Image saved.';
      } catch (error) {
        message.textContent = error.message || 'Could not add that image.';
      } finally {
        addButton.disabled = false;
        addButton.textContent = 'Add';
      }
    });

    imageUrlInput.addEventListener('input', () => imageUrlInput.setCustomValidity(''));

    shuffleButton.addEventListener('click', () => {
      const nextImage = chooseRandomImage();

      if (!nextImage) {
        message.textContent = 'No images to shuffle. Add an image URL first.';
        return;
      }

      applyImage(nextImage);
      message.textContent = '';
    });

    window.addEventListener('resize', () => {
      if (currentImage) showImageInfo(currentImage);
    });

    library = readLibrary();
    renderLinks();

    if (library.length) {
      applyImage(chooseRandomImage());
    } else {
      applyImage(null);
    }
  </script>
</body>
</html>
