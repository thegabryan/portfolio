<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Focus Timer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%8F%B8%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body class="fit">
<div class="wrap">
  <header class="nav">
    <strong class="brand">Focus Timer</strong>
    <span id="todayLbl" class="muted"></span>
    <button id="themeBtn" class="ghost hbtn" type="button">🌓</button>
    <nav>
      <a class="active" href="index.html">Timer</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="review.html">Review</a>
    </nav>
  </header>

  <div id="notice" class="notice" hidden></div>

  <div id="fuBar" class="notice fubar" hidden><span id="fuTxt"></span> <button id="fuOpen" class="ghost" type="button">Open</button></div>
  <section id="cards" class="cards" aria-label="Timers"></section>

  <section class="card bar" aria-label="Settings">
    <div class="brow">
      <span class="blabel">Settings</span>
      <label class="switch"><input id="auto" type="checkbox"><span>Auto-restart each hour (short beep, +1 point)</span></label>
      <label class="vol">🔊 <input id="vol" type="range" min="0" max="100" step="5" aria-label="Volume"><output id="volVal">50%</output></label>
      <label class="sel">Beep every
        <select id="beepMin" aria-label="Reminder beep interval">
          <option value="5">5 min</option><option value="10">10 min</option><option value="15">15 min</option>
          <option value="20">20 min</option><option value="30">30 min</option>
        </select>
      </label>
      <label class="sel" title="If Paused has run less than this when you start a timer, that Paused time moves to the new timer. 0 = off.">Short pause <input id="shortPause" type="number" min="0" max="600" inputmode="numeric" style="width:64px"> s</label>
      <label class="sel" title="If Paused runs this long with the page open, a bar and a short beep ask what you're doing. 0 = off.">Idle nudge <input id="idleNudge" type="number" min="0" max="600" inputmode="numeric" style="width:64px"> min</label>
      <span class="bells">🔔
        <label><input type="checkbox" data-bell="paused"> Paused</label>
        <label><input type="checkbox" data-bell="workflow"> Workflow</label>
        <label><input type="checkbox" data-bell="workout"> Workout</label>
        <label><input type="checkbox" data-bell="eating"> Eating</label>
      </span>
    </div>
  </section>

  <div class="bottom">
    <div class="tools" id="tools"></div>
    <div class="corner">
      <div class="oc" id="oc" aria-label="Outreach counter">
        <div><div class="cl">Outreach today</div><div class="cd" id="ocCount">0 / 3</div></div>
        <button id="ocMinus" class="ghost" type="button" aria-label="Remove one outreach">−</button>
        <button id="ocPlus" class="primary plus" type="button" aria-label="Add one outreach">+1</button>
        <button id="ocGoal" class="ghost" type="button" aria-label="Change the daily goal">Goal</button>
      </div>
      <div class="chrono" id="chrono" aria-label="Extra chronometer">
        <div><div class="cl">Chronometer</div><div class="cd" id="cd">0:00:00.0</div></div>
        <button id="cGo" class="tbtn" type="button">Start</button>
        <button id="cReset" class="ghost" type="button">Reset</button>
      </div>
    </div>
  </div>
</div>

<dialog id="noteDlg">
  <form method="dialog">
    <h2 id="noteTitle">Session saved</h2>
    <p id="noteInfo" class="muted" style="margin:0 0 12px"></p>
    <textarea id="noteInput" rows="1" maxlength="1000" placeholder="Write a note" autofocus></textarea>
    <p class="hint">Enter saves · Shift+Enter for a new line · each line gets its time.</p>
    <div id="projRow" style="margin-top:10px"><input id="projInput" list="projList" maxlength="60" placeholder="Project (optional)" autocomplete="off" style="width:100%"><datalist id="projList"></datalist></div>
    <div class="drow"><button class="primary" id="noteSave" value="save">Save</button></div>
  </form>
</dialog>

<div id="nudge" class="nudge" hidden role="status">
  <span id="nudgeTxt"></span>
  <span id="nudgeBtns"></span>
  <button type="button" class="ghost" id="nudgeNo">Still paused</button>
</div>

<form id="whoBox" class="who" hidden autocomplete="off">
  <input id="whoInput" type="text" maxlength="200" placeholder="Who? name or link (Enter saves)" aria-label="Who was this outreach to">
  <input id="whoNote" type="text" maxlength="1000" placeholder="Note (optional, Enter saves)" aria-label="Note for this outreach">
  <label class="whofu"><input id="whoFollow" type="checkbox"> Remind me to follow up (every 2 days, 3 times)</label>
</form>

<dialog id="lstDlg" class="lstdlg">
  <h2>📋 Outreach lists</h2>
  <div class="htabs" id="lstTabs"><button type="button" class="ghost on" data-t="follow">Follow-ups</button><button type="button" class="ghost" data-t="todo">To reach out</button><button type="button" class="ghost" data-t="done">Finished</button></div>
  <div id="lstBody" class="lstbody"></div>
  <div class="drow"><button type="button" class="primary" id="lstClose">Close</button></div>
</dialog>

<dialog id="gDlg">
  <form method="dialog">
    <h2 id="gTitle">Daily goal</h2>
    <div class="drow" style="justify-content:flex-start;align-items:center;margin-top:0">
      <input id="gH" type="number" min="0" max="23" inputmode="numeric" style="width:90px" aria-label="Hours"> h
      <input id="gM" type="number" min="0" max="59" inputmode="numeric" style="width:90px" aria-label="Minutes"> min
    </div>
    <p class="hint" id="gInfo"></p>
    <div class="drow"><button class="primary" value="save">Save</button></div>
  </form>
</dialog>

<dialog id="goalDlg">
  <form method="dialog">
    <h2>Daily outreach goal</h2>
    <input id="goalInput" type="number" min="1" max="9999" inputmode="numeric" autofocus>
    <div class="drow"><button class="primary" value="save">Save</button></div>
  </form>
</dialog>

<script src="app.js"></script>
<script src="help.js"></script>
<script src="alarms.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var ACTS = TSA.ACTS, META = TSA.META, pad = TSA.pad;
  var boot = TSA.boot(Date.now(), {});
  var S = TSA.get();
  TSA.initTheme($('themeBtn'));
  TSAHelp.init('timer');
  TSAAlarms.init();
  TSA.mountDataTools($('tools'), function () { S = TSA.get(); renderAll(); });
  (function () {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'ghost'; b.id = 'sumBtn'; b.textContent = 'Send day summary';
    b.title = 'Sends today\'s summary as a note to your Url Notes site (needs the userscript); otherwise copies it';
    $('tools').appendChild(b);
    b.addEventListener('click', function () {
      TSA.sendSummary(Date.now(), function (ok, text) {
        if (ok) { showNotice('Day summary queued for Url Notes ✓ (it arrives when the notes site is open)'); return; }
        var done = function (m) { showNotice(m); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done('Userscript not found on this page — summary copied to the clipboard instead.'); }, function () { prompt('Userscript not found. Copy the summary:', text); });
        else prompt('Userscript not found. Copy the summary:', text);
      });
    });
  })();

  function hms(sec) { sec = Math.max(0, Math.floor(sec)); return pad(Math.floor(sec / 3600)) + ':' + pad(Math.floor((sec % 3600) / 60)) + ':' + pad(sec % 60); }
  function clock(ms) { return new Date(ms).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); }
  function showNotice(msg) { var n = $('notice'); n.textContent = msg; n.hidden = false; }

  /* ---------- cards ---------- */
  var cardsEl = $('cards'), refs = {};
  cardsEl.innerHTML = ACTS.map(function (a) {
    var m = META[a];
    return '<article class="acard" data-act="' + a + '" style="--c:var(' + m.color + ')">' +
      '<h2><i class="dotc"></i>' + m.icon + ' ' + m.label + '</h2>' +
      '<div class="big" data-big>00:00:00</div>' +
      '<div class="state" data-state></div>' +
      '<div class="sub" data-sub></div>' +
      (TSA.GOALS[a] ? '<div class="goalbar" data-gbar><i></i></div><div class="goaltxt"><span data-gtxt></span> <button type="button" class="linkbtn" data-goal>Goal</button></div>' : '') +
      '<div class="cbtns"><button type="button" class="tbtn" data-toggle>Start</button></div>' +
      '<button type="button" class="nbtn" data-note>📝 Note</button></article>';
  }).join('');
  ACTS.forEach(function (a) {
    var el = cardsEl.querySelector('[data-act=' + a + ']');
    refs[a] = { el: el, big: el.querySelector('[data-big]'), state: el.querySelector('[data-state]'),
      gbar: el.querySelector('[data-gbar]'), gtxt: el.querySelector('[data-gtxt]'), sub: el.querySelector('[data-sub]'), btn: el.querySelector('[data-toggle]'), nbtn: el.querySelector('[data-note]') };
  });
  var SUBS = { paused: 'Today · counts by itself', sleep: 'Today · keeps counting if closed' };

  function renderLive() {
    var now = Date.now(), T = TSA.todayTotals(now), tm = S.timer, pts = TSA.todayPoints(now), workRem = TSA.WORK_SEC;
    ACTS.forEach(function (a) {
      var r = refs[a], on = S.active === a;
      r.el.classList.toggle('on', on);
      r.btn.classList.toggle('on', on);
      r.btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      if (a === 'work') {
        workRem = tm.mode === 'running' ? Math.max(0, Math.ceil((tm.endAt - now) / 1000))
          : tm.mode === 'paused' ? Math.ceil(tm.remainingMs / 1000) : TSA.WORK_SEC;
        r.big.textContent = hms(workRem);
        r.state.textContent = on ? 'Counting down' : tm.mode === 'paused' ? 'Stopped · time kept' : 'Ready · 1 hour';
        r.sub.innerHTML = '<strong>' + pts + '</strong> point' + (pts === 1 ? '' : 's') + ' today · ' + TSA.fmtDur(T.work) + ' worked';
        r.btn.textContent = on ? 'Stop' : tm.mode === 'paused' ? 'Resume' : 'Start';
      } else {
        r.big.textContent = hms(T[a]);
        r.state.textContent = on ? 'Running since ' + clock(S.activeSince) : 'Stopped';
        r.sub.textContent = SUBS[a] || 'Today';
        r.btn.textContent = on ? (a === 'paused' ? 'Running' : 'Stop') : 'Start';
      }
    });
    ACTS.forEach(function (a) {                        // daily goal bars (Work, Workout: reach it; Paused: stay under it)
      if (!TSA.GOALS[a]) return;
      var r = refs[a], g = S.settings.goals[a], sec = T[a], max = TSA.GOALS[a] === 'max';
      if (!g) { r.gbar.hidden = true; r.gtxt.textContent = max ? 'No daily limit' : 'No daily goal'; return; }
      r.gbar.hidden = false;
      var done = max ? sec <= g : sec >= g;
      r.gbar.firstChild.style.width = Math.min(100, sec / g * 100) + '%';
      r.gbar.classList.toggle('ok', !max && done);
      r.gbar.classList.toggle('over', max && !done);
      r.gtxt.textContent = TSA.fmtDur(sec) + ' / ' + TSA.fmtDur(g) + (max ? ' max' : '') + (max ? (done ? '' : ' · over') : (done ? ' ✓' : ''));
    });
    ACTS.forEach(function (a) {                        // note button: disabled until the timer has run at least once
      var t = TSA.noteTarget(a), nb = refs[a].nbtn;
      nb.disabled = !t;
      nb.textContent = t && t.note ? '📝 Edit note' : '📝 Note';
      nb.title = !t ? 'Nothing to attach a note to yet' : t.live ? 'Note for the run that is going now' : 'Note for the last run of this timer';
    });
    var shown = S.active === 'work' ? workRem : T[S.active];
    document.title = META[S.active].icon + ' ' + hms(shown) + ' · ' + META[S.active].label;
    TSA.setFavicon(S.active);
    renderOutreach(now);
    renderFollow();
    checkNudge(now);
  }

  /* ---------- settings bar ---------- */
  function renderAll() {
    $('auto').checked = !!S.settings.autoRestart;
    var v = Math.round((S.settings.volume == null ? 0.5 : S.settings.volume) * 100);
    $('vol').value = v; $('volVal').textContent = v + '%';
    $('beepMin').value = String(S.settings.beepMinutes);
    $('shortPause').value = S.settings.shortPauseSec;
    $('idleNudge').value = S.settings.idleNudgeMin;
    document.querySelectorAll('[data-bell]').forEach(function (c) { c.checked = S.settings.beep[c.dataset.bell] !== false; });
    renderLive();
    $('todayLbl').textContent = TSA.keyToDate(TSA.dayKey(Date.now())).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  }
  $('auto').addEventListener('change', function () { S.settings.autoRestart = $('auto').checked; TSA.save(); });
  $('vol').addEventListener('input', function () { S.settings.volume = $('vol').value / 100; $('volVal').textContent = $('vol').value + '%'; TSA.save(); });
  $('vol').addEventListener('change', function () { TSA.beep(1000, .22, .4); });
  $('idleNudge').addEventListener('change', function () {
    var v = Math.round(+$('idleNudge').value);
    S.settings.idleNudgeMin = v >= 0 && v <= 600 ? v : 30; $('idleNudge').value = S.settings.idleNudgeMin; TSA.save(); nudgeFor = null;
  });
  $('shortPause').addEventListener('change', function () {
    var v = Math.round(+$('shortPause').value);
    S.settings.shortPauseSec = v >= 0 && v <= 600 ? v : 20; $('shortPause').value = S.settings.shortPauseSec; TSA.save();
  });
  $('beepMin').addEventListener('change', function () { S.settings.beepMinutes = +$('beepMin').value; TSA.save(); });
  document.querySelectorAll('[data-bell]').forEach(function (c) {
    c.addEventListener('change', function () { S.settings.beep[c.dataset.bell] = c.checked; TSA.save(); });
  });

  /* ---------- switching timers and notes ---------- */
  var setNoteText = TSA.noteBox($('noteInput'), $('noteSave'));
  function openNote(t, auto) {
    var when = t.live ? 'running since ' + clock(t.start)
      : TSA.keyToDate(TSA.dayKey(t.start)).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ', ' + clock(t.start) + '–' + clock(t.end);
    $('noteTitle').textContent = META[t.act].icon + ' ' + META[t.act].label + ' · ' + when;
    $('noteInfo').textContent = auto ? 'Session saved. Add a note if you like (Esc skips it).' : 'Save with empty text to remove the note. Esc cancels.';
    setNoteText(t.note || '');
    var isProj = TSA.NOTE_ACTS.indexOf(t.act) >= 0;
    $('projRow').hidden = !isProj;
    $('projList').innerHTML = TSA.projectList().map(function (p) { return '<option value="' + p.replace(/"/g, '&quot;') + '"></option>'; }).join('');
    $('projInput').value = isProj ? (t.project || '') : '';
    $('noteDlg').returnValue = '';
    $('noteDlg').dataset.act = t.act; $('noteDlg').dataset.start = t.start;
    $('noteDlg').showModal();
    $('noteInput').focus(); $('noteInput').setSelectionRange($('noteInput').value.length, $('noteInput').value.length);   // caret at the end, so typing adds to the note
  }
  $('gDlg').addEventListener('close', function () {
    if (this.returnValue !== 'save') return;
    var sec = Math.max(0, Math.round(+$('gH').value || 0)) * 3600 + Math.max(0, Math.round(+$('gM').value || 0)) * 60;
    TSA.setGoalSec(this.dataset.act, Math.min(sec, 86399)); S = TSA.get(); renderAll();
  });
  /* keyboard: 1-7 = click that card, N or Enter = note for the running timer (not while typing or in a box) */
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey || e.shiftKey || e.repeat) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
    if (document.querySelector('dialog[open]')) return;
    /* Enter = note of the running timer (never "press the button that has focus"); nothing when no timer runs */
    if (e.key === 'Enter') {
      if (tag === 'A') return;
      e.preventDefault();
      var rb = S.active && refs[S.active] && refs[S.active].nbtn;
      if (rb && !rb.disabled) rb.click();
      return;
    }
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= ACTS.length) { e.preventDefault(); refs[ACTS[n - 1]].btn.click(); }
    else if (e.key === 'n' || e.key === 'N') { var nb = refs[S.active].nbtn; if (!nb.disabled) { e.preventDefault(); nb.click(); } }
  });
  $('noteDlg').addEventListener('close', function () {
    if (this.returnValue === 'save') { TSA.setNoteAt(this.dataset.act, +this.dataset.start, $('noteInput').value, $('projRow').hidden ? undefined : $('projInput').value); S = TSA.get(); renderAll(); }
  });

  cardsEl.addEventListener('click', function (e) {
    TSA.audio();
    var gl = e.target.closest('[data-goal]');
    if (gl) {
      var ga = gl.closest('.acard').dataset.act, cur = S.settings.goals[ga] || 0, mx = TSA.GOALS[ga] === 'max';
      $('gTitle').textContent = META[ga].icon + ' ' + META[ga].label + (mx ? ' · daily maximum' : ' · daily goal');
      $('gInfo').textContent = (mx ? 'The most Paused time you want in a day. ' : 'The time you want to reach each day. ') + '0 h 0 min removes it.';
      $('gH').value = Math.floor(cur / 3600); $('gM').value = Math.floor(cur % 3600 / 60);
      $('gDlg').dataset.act = ga; $('gDlg').returnValue = ''; $('gDlg').showModal(); $('gH').select(); return;
    }
    var nb = e.target.closest('[data-note]');
    if (nb) { var t = TSA.noteTarget(nb.closest('.acard').dataset.act); if (t) openNote(t, false); return; }
    var b = e.target.closest('[data-toggle]'); if (!b) return;
    var act = b.closest('.acard').dataset.act, res;
    if (S.active === act) { if (act === 'paused') return; res = TSA.switchTo('paused'); }   // clicking a running card only stops it
    else { if (act === 'work') TSA.alarmStop(); res = TSA.switchTo(act); }
    S = TSA.get(); renderAll();
    if (res && res.closed && TSA.NOTE_ACTS.indexOf(res.closed.act) >= 0 && res.closed.end - res.closed.start >= 1000) openNote({ act: res.closed.act, start: res.closed.start, end: res.closed.end, live: false, note: res.closed.note || '' }, true);
  });

  /* ---------- outreach counter ---------- */
  function renderOutreach(now) {
    var n = TSA.outreachToday(now), g = S.outreach.goal;
    $('ocCount').textContent = n + ' / ' + g;
    $('ocCount').classList.toggle('met', n >= g);
    $('ocMinus').disabled = n === 0;
  }
  var whoMs = 0, whoTimer = null;
  function hideWho() { $('whoBox').hidden = true; clearTimeout(whoTimer); var a = document.activeElement; if (a === $('whoInput') || a === $('whoNote')) a.blur(); }
  function armWho() { clearTimeout(whoTimer); whoTimer = setTimeout(hideWho, 10000); }
  $('whoInput').addEventListener('input', armWho); $('whoNote').addEventListener('input', armWho);
  $('whoBox').addEventListener('focusin', function () { clearTimeout(whoTimer); });
  $('whoBox').addEventListener('focusout', function () { setTimeout(function () { if (!$('whoBox').hidden && !$('whoBox').contains(document.activeElement)) armWho(); }, 0); });
  $('whoBox').addEventListener('submit', function (e) {
    e.preventDefault();
    var nm = $('whoInput').value.trim();
    if (nm && whoMs) TSA.setOutreachName(whoMs, nm);
    if ($('whoNote').value.trim() && whoMs) TSA.setOutreachNote(whoMs, $('whoNote').value);
    if (nm && $('whoFollow').checked) TSA.startFollow(nm, '', whoMs || Date.now());
    S = TSA.get(); renderFollow();
    hideWho();
  });
  $('whoBox').addEventListener('keydown', function (e) { if (e.key === 'Escape') hideWho(); });
  $('ocPlus').addEventListener('click', function () {
    var now = Date.now(); whoMs = TSA.outreachAdd(now); renderOutreach(now);
    $('whoInput').value = ''; $('whoNote').value = ''; $('whoFollow').checked = false; $('whoBox').hidden = false;
    var r = $('oc').getBoundingClientRect(); $('whoBox').style.left = Math.max(8, Math.min(r.left, innerWidth - 328)) + 'px'; $('whoBox').style.bottom = (innerHeight - r.top + 8) + 'px';
    $('whoInput').focus(); armWho();
  });
  $('ocMinus').addEventListener('click', function () { hideWho(); TSA.outreachUndo(); renderOutreach(Date.now()); });
  $('ocGoal').addEventListener('click', function () { $('goalInput').value = S.outreach.goal; $('goalDlg').returnValue = ''; $('goalDlg').showModal(); });
  $('goalDlg').addEventListener('close', function () {
    if (this.returnValue === 'save') { TSA.setGoal($('goalInput').value); S = TSA.get(); renderOutreach(Date.now()); }
  });

  /* ---------- extra chronometer (separate: its own storage, not in the export or dashboard) ---------- */
  var C = { running: false, startedAt: 0, accMs: 0 };
  function loadChrono() {
    try { var o = JSON.parse(localStorage.getItem(TSA.CHRONO_KEY)); if (o && typeof o.accMs === 'number') C = o; } catch (e) {}
  }
  function saveChrono() { try { localStorage.setItem(TSA.CHRONO_KEY, JSON.stringify(C)); } catch (e) {} }
  function chronoMs() { return C.accMs + (C.running ? Date.now() - C.startedAt : 0); }
  function fmtChrono(ms) {
    var t = Math.floor(ms / 100), tenth = t % 10, s = Math.floor(t / 10), h = Math.floor(s / 3600);
    return h + ':' + pad(Math.floor((s % 3600) / 60)) + ':' + pad(s % 60) + '.' + tenth;
  }
  function renderChrono() {
    $('cd').textContent = fmtChrono(chronoMs());
    $('cGo').textContent = C.running ? 'Pause' : 'Start';
    $('cGo').classList.toggle('on', C.running);
    $('cReset').disabled = !C.running && C.accMs === 0;
  }
  $('cGo').addEventListener('click', function () {
    if (C.running) { C.accMs = chronoMs(); C.running = false; } else { C.startedAt = Date.now(); C.running = true; }
    saveChrono(); renderChrono();
  });
  $('cReset').addEventListener('click', function () { C = { running: false, startedAt: 0, accMs: 0 }; saveChrono(); renderChrono(); });
  window.addEventListener('storage', function (e) { if (e.key === TSA.CHRONO_KEY) { loadChrono(); renderChrono(); } });
  loadChrono(); renderChrono();
  setInterval(renderChrono, 100);

  /* ---------- idle nudge: Paused for a long time while the page is open ---------- */
  var openAt = Date.now(), nudgeFor = null, nudgeNext = 0;
  $('nudgeBtns').innerHTML = ACTS.filter(function (a) { return a !== 'paused'; }).map(function (a) {
    return '<button type="button" class="ghost" data-nact="' + a + '">' + META[a].icon + ' ' + META[a].label + '</button>';
  }).join('');
  $('nudge').addEventListener('click', function (e) {
    var b = e.target.closest('[data-nact]');
    if (b) { refs[b.dataset.nact].btn.click(); $('nudge').hidden = true; }
  });
  $('nudgeNo').addEventListener('click', function () { $('nudge').hidden = true; });
  function checkNudge(now) {
    var lim = S.settings.idleNudgeMin * 60000;
    if (S.active !== 'paused' || !lim) { $('nudge').hidden = true; nudgeFor = null; return; }
    if (nudgeFor !== S.activeSince) { nudgeFor = S.activeSince; nudgeNext = Math.max(S.activeSince, openAt) + lim; }
    if (now >= nudgeNext) {
      nudgeNext = now + lim;
      $('nudgeTxt').textContent = '⏸️ Paused for ' + TSA.fmtDur(Math.floor((now - S.activeSince) / 1000)) + '. What are you doing?';
      $('nudge').hidden = false;
      TSA.nudgeBeep();
    }
  }

  /* ---------- follow-ups and the 'To reach out' list ---------- */
  var esc = function (t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var linkify = function (t) { return esc(t).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); };
  var lstTab = 'follow';
  var dayLbl = function (ms) { return new Date(ms).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); };
  var leadHtml = function (f) { return '<b>' + linkify(f.name || f.url) + '</b>' + (f.name && f.url ? ' <span class="muted">' + linkify(f.url) + '</span>' : ''); };
  function renderFollow() {
    var now = Date.now(), due = TSA.followDue(now), todo = TSA.todoList().length;
    $('fuBar').hidden = !due.length;
    if (due.length) $('fuTxt').textContent = '📋 ' + due.length + ' follow-up' + (due.length === 1 ? '' : 's') + ' due: ' + due.slice(0, 3).map(function (f) { return f.name || f.url; }).join(', ') + (due.length > 3 ? '…' : '');
    var b = $('lstBtn'); if (b) b.textContent = '📋 Outreach lists' + (due.length ? ' (' + due.length + ' due)' : todo ? ' (' + todo + ')' : '');
    if ($('lstDlg').open) paintLists();
  }
  function paintLists() {
    var now = Date.now(), html = '';
    [].forEach.call($('lstTabs').children, function (b) { b.classList.toggle('on', b.dataset.t === lstTab); });
    if (lstTab === 'follow') {
      var act = TSA.followList().filter(function (f) { return f.status === 'active'; }).sort(function (a, b) { return a.due - b.due; });
      html = act.length ? act.map(function (f) {
        var isDue = f.due <= now;
        return '<div class="lrow"><div class="lmain">' + leadHtml(f) + '<div class="muted">' + f.count + ' / ' + TSA.FOLLOW_MAX + ' follow-ups · ' + (isDue ? '<b class="duenow">due now</b>' : 'next ' + dayLbl(f.due)) + ' · outreach ' + dayLbl(f.started) + '</div></div>' +
          '<div class="lbtns"><button type="button" class="primary" data-fu-done="' + f.id + '">Followed up</button><button type="button" class="ghost" data-fu-rep="' + f.id + '">Replied</button><button type="button" class="ghost" data-fu-stop="' + f.id + '">Stop</button></div></div>';
      }).join('') : '<p class="muted">No active follow-ups. Mark an outreach as reached (or tick “Remind me to follow up” on the +1 box) and it shows up here.</p>';
    } else if (lstTab === 'todo') {
      var td = TSA.todoList();
      html = '<form id="todoForm" class="todoform"><input id="tdName" type="text" maxlength="120" placeholder="Name"><input id="tdUrl" type="text" maxlength="300" placeholder="Channel link"><button class="primary">Add</button></form>' +
        (td.length ? td.map(function (t) {
          return '<div class="lrow"><div class="lmain">' + leadHtml(t) + '<div class="muted">added ' + dayLbl(t.added) + '</div></div><div class="lbtns"><button type="button" class="primary" data-td-reach="' + t.id + '">Outreached ✓</button><button type="button" class="ghost" data-td-del="' + t.id + '">Remove</button></div></div>';
        }).join('') : '<p class="muted">Nobody on the list. The YouTube userscript adds channels here, or add one above.</p>');
    } else {
      var fin = TSA.followList().filter(function (f) { return f.status !== 'active'; }).sort(function (a, b) { return (b.log[b.log.length - 1] || b.started) - (a.log[a.log.length - 1] || a.started); });
      var lab = { done: 'finished (3 follow-ups)', replied: 'replied', stopped: 'stopped' };
      html = fin.length ? fin.map(function (f) { return '<div class="lrow"><div class="lmain">' + leadHtml(f) + '<div class="muted">' + lab[f.status] + ' · ' + f.count + ' follow-up' + (f.count === 1 ? '' : 's') + ' · outreach ' + dayLbl(f.started) + '</div></div></div>'; }).join('') : '<p class="muted">Nothing finished yet.</p>';
    }
    if (html === lastLstHtml && lstTab === lastLstTab) return;   // nothing changed: do not rebuild (it would drop the typing focus)
    var ae = document.activeElement, keep = null;
    if (ae && $('lstBody').contains(ae) && ae.id) keep = { id: ae.id, v: ae.value, a: ae.selectionStart, b: ae.selectionEnd };
    var vals = { tdName: $('tdName') ? $('tdName').value : '', tdUrl: $('tdUrl') ? $('tdUrl').value : '' };
    lastLstHtml = html; lastLstTab = lstTab;
    $('lstBody').innerHTML = html;
    if ($('tdName')) {
      if (lstTab === 'todo') { $('tdName').value = vals.tdName; $('tdUrl').value = vals.tdUrl; }
      if (!$('tdName').value && !$('tdUrl').value && ytHint && !ytHintUsed(ytHint)) { $('tdName').value = ytHint.name; $('tdUrl').value = ytHint.url; $('tdName').title = 'Filled from the YouTube channel you last visited'; }
    }
    if (keep && $(keep.id)) { var el = $(keep.id); el.focus(); try { el.setSelectionRange(keep.a, keep.b); } catch (e) {} }
  }
  var lastLstHtml = '', lastLstTab = '', ytHint = null, autoName = '';
  function ytHintUsed(h) {
    var k = (h.url || '').toLowerCase();
    return TSA.todoList().concat(TSA.followList()).some(function (x) { return (x.url || '').toLowerCase() === k; });
  }
  window.addEventListener('message', function (e) {
    var m = e.data;
    if (e.origin !== location.origin || !m || m.channel !== 'timer-bridge' || m.from !== 'userscript' || m.type !== 'channel-hint') return;
    ytHint = m.url ? { name: String(m.name || '').slice(0, 120), url: String(m.url).slice(0, 300) } : null;
    lastLstHtml = '';   // let the open form pick it up
    if ($('lstDlg').open) paintLists();
  });
  (function () {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'ghost'; b.id = 'lstBtn'; b.textContent = '📋 Outreach lists';
    $('tools').appendChild(b);
    var open = function (tab) { lstTab = tab || lstTab; lastLstHtml = ''; paintLists(); if (!$('lstDlg').open) $('lstDlg').showModal(); };
    b.addEventListener('click', function () { open(); });
    $('fuOpen').addEventListener('click', function () { open('follow'); });
    $('lstClose').addEventListener('click', function () { $('lstDlg').close(); });
    $('lstTabs').addEventListener('click', function (e) { var t = e.target.closest('button'); if (t) { lstTab = t.dataset.t; paintLists(); } });
    $('lstDlg').addEventListener('click', function (e) {
      var t = e.target.closest('button'); if (!t) { if (e.target === $('lstDlg')) $('lstDlg').close(); return; }
      var d = t.dataset;
      if (d.fuDone) TSA.followDone(d.fuDone); else if (d.fuRep) TSA.followStop(d.fuRep, 'replied'); else if (d.fuStop) TSA.followStop(d.fuStop, 'stopped');
      else if (d.tdDel) TSA.removeTodo(d.tdDel);
      else if (d.tdReach) { var it = TSA.todoList().filter(function (x) { return x.id === d.tdReach; })[0]; if (it) { TSA.markReached(it.name, it.url, Date.now(), { note: 'From the To-reach-out list' }); renderOutreach(Date.now()); } }
      else return;
      S = TSA.get(); renderFollow();
    });
    $('lstDlg').addEventListener('submit', function (e) {
      if (e.target.id !== 'todoForm') return; e.preventDefault();
      if (TSA.addTodo($('tdName').value, $('tdUrl').value)) { $('tdName').value = ''; $('tdUrl').value = ''; S = TSA.get(); renderFollow(); }
    });
    $('lstDlg').addEventListener('input', function (e) {   // a pasted channel link fills the name from its @handle
      if (e.target.id !== 'tdUrl' || ($('tdName').value && $('tdName').value !== autoName)) return;   // never overwrite a name you typed
      var m = /youtube\.com\/@([^\/?#\s]+)/i.exec(e.target.value);
      if (m) { try { autoName = decodeURIComponent(m[1]); } catch (x) { autoName = m[1]; } $('tdName').value = autoName; }
    });
    /* channels sent by the YouTube userscript */
    window.addEventListener('message', function (e) {
      var m = e.data;
      if (e.origin !== location.origin || !m || m.channel !== 'timer-bridge' || m.from !== 'userscript' || m.type !== 'lead') return;
      if (TSA.leadFromScript(m)) {
        S = TSA.get(); renderOutreach(Date.now()); renderFollow();
        showNotice((m.kind === 'done' ? '+1 outreach and follow-ups started for ' : 'Added to “To reach out”: ') + (m.name || m.url));
        window.postMessage({ channel: 'timer-bridge', from: 'page', type: 'lead-ok', id: m.id }, location.origin);
      }
    });
    renderFollow(); setInterval(renderFollow, 60000);
  })();

  /* ---------- run ---------- */
  TSA.engine(function (kind) {
    S = TSA.get();
    if (kind === 'tick') renderLive(); else renderAll();
  });
  renderAll();
  /* Switch requests from the userscript's capsule: ?switch=workflow in the address, or a message while open.
     Pressing the card's button is the same as clicking it (so notes boxes and the short-pause rule behave as usual);
     a card that is already running is left alone (clicking it would stop it). */
  function switchTo(act) {
    if (ACTS.indexOf(act) < 0) return false;
    if (S.active !== act) refs[act].btn.click();
    return true;
  }
  (function () {
    var m = /[?&]switch=([a-z]+)/.exec(location.search);
    if (m) { switchTo(m[1]); try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {} }
    window.addEventListener('message', function (e) {
      var d = e.data;
      if (e.origin !== location.origin || !d || d.channel !== 'timer-bridge' || d.from !== 'userscript' || d.type !== 'switch') return;
      if (switchTo(String(d.act))) window.postMessage({ channel: 'timer-bridge', from: 'page', type: 'switch-ok', id: d.id }, location.origin);
    });
  })();
  setTimeout(function () { TSA.maybeAutoBackup(); S = TSA.get(); }, 2500);   // once a day, on the first open
  if (!TSA.storageOK()) showNotice('Your browser is blocking storage, so nothing will be saved. Try a normal (non-private) window.');
  else if (boot.closedAct) showNotice('The page was closed, so ' + META[boot.closedAct.act].label + ' stopped at ' + clock(boot.closedAct.at) + '. The time since then counted as Paused.');
})();
</script>
