<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review · Focus Timer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="nav">
    <strong class="brand">Focus Timer</strong>
    <button id="themeBtn" class="ghost hbtn" type="button">🌓</button>
    <nav>
      <a href="index.html">Timer</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="outreach.html">Outreach</a>
      <a class="active" href="review.html">Review</a>
    </nav>
  </header>

  <section class="card">
    <div class="head">
      <h2 id="title">Review</h2>
      <div class="nav-m" style="display:flex;gap:6px;align-items:center">
        <button id="kWeek" type="button" class="ghost">Week</button>
        <button id="kMonth" type="button" class="ghost">Month</button>
        <button id="prev" type="button" aria-label="Previous period">‹</button>
        <span id="label" style="min-width:150px;text-align:center"></span>
        <button id="next" type="button" aria-label="Next period">›</button>
      </div>
    </div>
    <p id="note" class="muted" style="margin:0 0 10px"></p>
    <div id="cmp" class="xscroll"></div>
  </section>

  <section class="card">
    <div class="head"><h2 id="calTitle">Work heatmap</h2></div>
    <div id="cal" class="cal"></div>
    <p class="muted" style="margin:10px 0 0">Darker means more Work time, compared with your longest Work day of that month.</p>
  </section>

  <section class="card">
    <h2>Work by hour of day (minutes)</h2>
    <div id="hours"></div>
  </section>

  <section class="card">
    <h2>Streaks</h2>
    <p class="muted" style="margin:0 0 10px">A day counts for a timer when it ran at least 1 minute that day.</p>
    <div id="streaks" class="xscroll"></div>
  </section>
</div>

<a id="runpop" class="runpop" href="index.html" title="Go to the timers"></a>

<script src="app.js"></script>
<script src="help.js"></script>
<script src="alarms.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var ACTS = TSA.ACTS, META = TSA.META, dur = TSA.fmtDur, pad = TSA.pad;
  TSA.boot(Date.now(), {});
  TSA.initTheme($('themeBtn'));
  TSAHelp.init('review');
  TSAAlarms.init();
  var kind = 'week', off = 0;     // off: 0 = this period, -1 = the one before, ...

  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function fmtDay(k, long) { return TSA.keyToDate(k).toLocaleDateString('en-US', long ? { month: 'short', day: 'numeric', year: 'numeric' } : { month: 'short', day: 'numeric' }); }
  function hms(sec) { return pad(Math.floor(sec / 3600)) + ':' + pad(Math.floor(sec % 3600 / 60)) + ':' + pad(sec % 60); }
  function dot(a) { return '<i class="dotc" style="--c:var(' + META[a].color + ')"></i>'; }
  function monthKey(y, m) { var d = new Date(y, m, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-01'; }
  function daysIn(y, m) { return new Date(y, m + 1, 0).getDate(); }

  /* the selected period: start/end day keys, how many days of it have passed, and the matching earlier stretch */
  function period(A) {
    var start, end, prevStart, len;
    if (kind === 'week') {
      start = TSA.addDays(A.weekStart, 7 * off); end = TSA.addDays(start, 6); prevStart = TSA.addDays(start, -7); len = 7;
    } else {
      var b = TSA.keyToDate(A.todayK), y = b.getFullYear(), m = b.getMonth() + off;
      start = monthKey(y, m); var f = new Date(y, m, 1); len = daysIn(f.getFullYear(), f.getMonth());
      end = f.getFullYear() + '-' + pad(f.getMonth() + 1) + '-' + pad(len);
      prevStart = monthKey(y, m - 1);
    }
    var n = end >= A.todayK ? Math.min(len, Math.round((TSA.keyToDate(A.todayK) - TSA.keyToDate(start)) / 864e5) + 1) : len;
    var pf = TSA.keyToDate(prevStart), plen = kind === 'week' ? 7 : daysIn(pf.getFullYear(), pf.getMonth());
    return { start: start, end: end, n: n, len: len, prevStart: prevStart, prevN: Math.min(n, plen), live: end >= A.todayK };
  }
  function sums(A, startKey, n) {
    var o = { points: 0, outreach: 0 }, i, k, d;
    ACTS.forEach(function (a) { o[a] = 0; });
    for (i = 0; i < n; i++) {
      k = TSA.addDays(startKey, i); d = A.per[k]; if (!d) continue;
      o.points += d.points; o.outreach += d.outreach;
      ACTS.forEach(function (a) { o[a] += d.t[a]; });
    }
    return o;
  }
  function diff(cur, prev, isTime) {
    var d = cur - prev;
    if (Math.abs(d) < (isTime ? 1 : 0.5)) return '<span class="muted">same</span>';
    var s = (d > 0 ? '+' : '−') + (isTime ? dur(Math.abs(Math.round(d))) : Math.abs(d));
    return '<span class="' + (d > 0 ? 'up' : 'down') + '">' + s + '</span>';
  }

  function barsSvg(vals, labels, aria) {
    var W = 720, H = 200, pl = 34, pr = 6, pt = 14, pb = 26, n = vals.length, max = Math.max.apply(null, vals.concat([1]));
    max = Math.ceil(max / 5) * 5 || 5;
    var iw = W - pl - pr, ih = H - pt - pb, step = iw / n, bw = Math.max(2, step * 0.68), s = '';
    s += '<line class="axis" x1="' + pl + '" y1="' + (H - pb) + '" x2="' + (W - pr) + '" y2="' + (H - pb) + '"/>';
    s += '<text class="lbl" x="' + (pl - 6) + '" y="' + (pt + 4) + '" text-anchor="end">' + max + '</text><text class="lbl" x="' + (pl - 6) + '" y="' + (H - pb + 4) + '" text-anchor="end">0</text>';
    vals.forEach(function (v, i) {
      var h = v / max * ih, x = pl + i * step + (step - bw) / 2;
      s += '<rect class="bar' + (v === 0 ? ' zero' : '') + '" x="' + x + '" y="' + (v === 0 ? H - pb - 2 : H - pb - h) + '" width="' + bw + '" height="' + (v === 0 ? 2 : h) + '" rx="3"><title>' + esc(labels[i]) + ': ' + v + ' min</title></rect>';
      if (i % 2 === 0) s += '<text class="lbl" x="' + (x + bw / 2) + '" y="' + (H - 8) + '" text-anchor="middle">' + i + '</text>';
    });
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(aria) + '">' + s + '</svg>';
  }

  function streakOf(A, a) {
    var keys = Object.keys(A.per).sort(), first = keys[0];
    if (!first) return { cur: 0, best: 0, total: 0 };
    var used = function (k) { return A.per[k] && A.per[k].t[a] >= 60; };
    var best = 0, run = 0, total = 0, k = first, guard = 0;
    while (k <= A.todayK && guard++ < 4000) { if (used(k)) { run++; total++; if (run > best) best = run; } else run = 0; k = TSA.addDays(k, 1); }
    var cur = 0; k = A.todayK;
    if (!used(k)) k = TSA.addDays(k, -1);          // today may simply not have started yet
    while (used(k)) { cur++; k = TSA.addDays(k, -1); }
    return { cur: cur, best: best, total: total };
  }

  function renderPop() {
    var S = TSA.get(), now = Date.now(), m = META[S.active], el = $('runpop'), t;
    if (S.active === 'work' && S.timer.mode === 'running') t = 'time left ' + hms(Math.max(0, Math.ceil((S.timer.endAt - now) / 1000)));
    else t = hms(Math.max(0, Math.floor((now - S.activeSince) / 1000)));
    el.style.setProperty('--c', 'var(' + m.color + ')');
    if (!el.firstChild || el.dataset.act !== S.active) {
      el.dataset.act = S.active;
      el.innerHTML = '<span class="ri"></span><strong class="rl"></strong> · <b class="rt"></b>';
      el.querySelector('.ri').textContent = m.icon + ' '; el.querySelector('.rl').textContent = m.label;
    }
    el.querySelector('.rt').textContent = t;   // only the text changes, so a click on the pill is never lost
  }
  $('runpop').addEventListener('click', function (e) {
    if (e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey) return;   // middle / Ctrl+click keep their normal meaning
    e.preventDefault(); location.href = 'index.html';
  });

  function render() {
    var A = TSA.analyze(), P = period(A), now = Date.now();
    $('kWeek').classList.toggle('on', kind === 'week'); $('kMonth').classList.toggle('on', kind === 'month');
    $('next').disabled = off >= 0;
    var f = TSA.keyToDate(P.start);
    $('label').textContent = kind === 'week' ? fmtDay(P.start) + ' – ' + fmtDay(P.end) : f.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    $('title').textContent = kind === 'week' ? (off === 0 ? 'This week' : 'Week review') : (off === 0 ? 'This month' : 'Month review');

    /* comparison */
    var cur = sums(A, P.start, P.n), prev = sums(A, P.prevStart, P.prevN);
    $('note').textContent = P.live
      ? 'Compared with the same ' + P.n + ' day' + (P.n === 1 ? '' : 's') + ' of the ' + (kind === 'week' ? 'week' : 'month') + ' before (' + fmtDay(P.prevStart) + ' – ' + fmtDay(TSA.addDays(P.prevStart, P.prevN - 1)) + ').'
      : 'Compared with the ' + (kind === 'week' ? 'week' : 'month') + ' before (' + fmtDay(P.prevStart) + ' – ' + fmtDay(TSA.addDays(P.prevStart, P.prevN - 1)) + ').';
    var rows = ACTS.map(function (a) {
      return '<tr><td>' + dot(a) + META[a].icon + ' ' + META[a].label + '</td><td>' + (cur[a] >= 1 ? dur(Math.round(cur[a])) : '–') + '</td><td>' + diff(cur[a], prev[a], true) +
        '</td><td>' + (prev[a] >= 1 ? dur(Math.round(prev[a])) : '–') + '</td><td>' + (cur[a] >= 1 ? dur(Math.round(cur[a] / P.n)) : '–') + '</td></tr>';
    }).join('');
    rows += '<tr><td>⭐ Points</td><td>' + cur.points + '</td><td>' + diff(cur.points, prev.points, false) + '</td><td>' + prev.points + '</td><td>' + (cur.points / P.n).toFixed(1) + '</td></tr>';
    rows += '<tr><td>🤝 Outreach</td><td>' + cur.outreach + '</td><td>' + diff(cur.outreach, prev.outreach, false) + '</td><td>' + prev.outreach + '</td><td>' + (cur.outreach / P.n).toFixed(1) + '</td></tr>';
    $('cmp').innerHTML = '<table><thead><tr><th>Timer</th><th>This ' + kind + '</th><th>Change</th><th>Before</th><th>Avg / day</th></tr></thead><tbody>' + rows + '</tbody></table>';

    /* heatmap of the month that holds the period's first day */
    var y = f.getFullYear(), m = f.getMonth(), dim = daysIn(y, m), maxW = 1, d, k;
    $('calTitle').textContent = 'Work heatmap · ' + f.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    for (d = 1; d <= dim; d++) { k = y + '-' + pad(m + 1) + '-' + pad(d); if (A.per[k] && A.per[k].t.work > maxW) maxW = A.per[k].t.work; }
    var html = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(function (w) { return '<div class="dow">' + w + '</div>'; }).join('');
    for (var e = 0; e < new Date(y, m, 1).getDay(); e++) html += '<div class="cell empty"></div>';
    for (d = 1; d <= dim; d++) {
      k = y + '-' + pad(m + 1) + '-' + pad(d);
      var w = A.per[k] ? A.per[k].t.work : 0, cls = 'cell' + (k > A.todayK ? ' future' : '') + (k === A.todayK ? ' today' : ''), st = '';
      if (w >= 60) { var pct = 15 + Math.round(w / maxW * 80); st = ' style="background:color-mix(in srgb, var(--accent) ' + pct + '%, var(--cell))"'; if (pct > 55) cls += ' hot'; }
      html += '<div class="' + cls + '"' + st + ' title="' + fmtDay(k, true) + ': ' + (w >= 60 ? dur(Math.round(w)) + ' of Work' : 'no Work') + '"><span>' + d + '</span><b>' + (w >= 60 ? (w / 3600).toFixed(1) : '') + '</b></div>';
    }
    $('cal').innerHTML = html;

    /* work by hour of the selected period */
    var from = TSA.keyToDate(P.start).getTime(), to = TSA.keyToDate(TSA.addDays(P.end, 1)).getTime();
    var hrs = TSA.actByHour('work', from, to, now).map(function (s) { return Math.round(s / 60); });
    var any = hrs.some(function (v) { return v > 0; });
    $('hours').innerHTML = any ? barsSvg(hrs, hrs.map(function (v, i) { return i + ':00'; }), 'Work minutes by hour of day') : '<div class="empty-msg">No Work in this period.</div>';

    /* streaks */
    $('streaks').innerHTML = '<table><thead><tr><th>Timer</th><th>Current streak</th><th>Longest streak</th><th>Days used</th></tr></thead><tbody>' + ACTS.map(function (a) {
      var s = streakOf(A, a);
      return '<tr><td>' + dot(a) + META[a].icon + ' ' + META[a].label + '</td><td>' + s.cur + (s.cur === 1 ? ' day' : ' days') + '</td><td>' + s.best + (s.best === 1 ? ' day' : ' days') + '</td><td>' + s.total + '</td></tr>';
    }).join('') + '</tbody></table>';
    renderPop();
  }

  $('kWeek').addEventListener('click', function () { kind = 'week'; off = 0; render(); });
  $('kMonth').addEventListener('click', function () { kind = 'month'; off = 0; render(); });
  $('prev').addEventListener('click', function () { off--; render(); });
  $('next').addEventListener('click', function () { if (off < 0) { off++; render(); } });

  var ticks = 0;
  TSA.engine(function (kind2) { if (kind2 === 'tick') { renderPop(); if (++ticks % 40 === 0) render(); } else render(); });
  render();
})();
</script>
</body>
</html>
